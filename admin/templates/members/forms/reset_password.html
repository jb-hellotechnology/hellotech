<perch:form id="reset" method="post" app="perch_members">

	<p>Enter your email address and we'll email you a new password.</p>

	<div style="margin-bottom:1rem">
		<perch:label for="email">Email</perch:label>
		<perch:input type="email" id="email" required="true" label="Email" placeholder="you@company.com" helper="PerchMembers_Members::check_email_exists" />
		<perch:error for="email" type="required"><small class="error">Please add your email address</small></perch:error>
		<perch:error for="email" type="helper"><small class="error">We don't have an account with that email address.</small></perch:error>
	</div>

	<div>
		<perch:input type="submit" value="Email me a new password" class="btn btn--primary" />
	</div>

	<perch:success>
		<p>A new password has been emailed to you. <a href="/members/login">Log in</a> with it, then change it from your profile.</p>
	</perch:success>

</perch:form>
