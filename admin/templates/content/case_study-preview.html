	<article class="case-card<perch:if exists="image"> case-card--visual<perch:else /><perch:if exists="image_thumbnail"> case-card--visual</perch:if></perch:if>">
	  <perch:if exists="image">
		<a class="case-card__media stripe" href="/work/<perch:content type="text" id="slug" label="Slug" />" tabindex="-1">
		  <img src="<perch:content type="image" id="image" label="Image Hero" width="900" />" alt="<perch:if exists="alt"><perch:content id="alt" type="text" label="Description" /><perch:else /><perch:content type="text" id="title" label="Title" title="true" order="1" /></perch:if>" loading="<perch:if exists="perch_item_first">eager" fetchpriority="high<perch:else />lazy</perch:if>" decoding="async">
		</a>
	  <perch:else />
		<perch:if exists="image_thumbnail">
		  <a class="case-card__media stripe" href="/work/<perch:content type="text" id="slug" label="Slug" />" tabindex="-1">
			<img src="<perch:content type="image" id="image_thumbnail" width="900" />" alt="<perch:if exists="alt_thumbnail"><perch:content id="alt_thumbnail" type="text" /><perch:else /><perch:content type="text" id="title" label="Title" title="true" order="1" /></perch:if>" loading="<perch:if exists="perch_item_first">eager" fetchpriority="high<perch:else />lazy</perch:if>" decoding="async">
		  </a>
		</perch:if>
	  </perch:if>
	  <div class="case-card__body">
	  <perch:repeater id="tags" label="Tags" order="3">
		<span class="tag tag--<perch:content id="colour" type="select" label="Icon colour" options="Teal|teal, Orange|orange, Yellow|yellow" default="teal" />"><perch:content type="text" id="tag" label="Tag" /></span>
	  </perch:repeater>
	  <h2 class="case-card__title"><perch:content type="text" id="title" label="Title" title="true" order="1" /></h2>
	  <p class="card__text"><perch:content type="text" id="intro" label="Intro" order="2" /></p>
	  <div class="case-card__defs">
		<div><div class="def__label">Client</div><div class="def__value"><perch:content type="text" id="client" label="Client" /></div></div>
		<div><div class="def__label">Sector</div><div class="def__value"><perch:content type="text" id="sector" label="Sector" /></div></div>
		<div><div class="def__label">Services</div><div class="def__value"><perch:content type="text" id="services" label="Services" /></div></div>
		<div><div class="def__label">Outcome</div><div class="def__value def__value--accent"><perch:content type="text" id="outcome" label="Outcome" /></div></div>
	  </div>
	  <div class="mt-5">
		  <a class="link" href="/work/<perch:content type="text" id="slug" label="Slug" />">Read the case study <i data-lucide="arrow-right"></i></a>
	  </div>
	  </div>
	</article>
